# ==============================================================================
# 12-Factor Principle: Factor III — Config
# Store config in the environment.
#
# Why sensitive backing service endpoints live in a Kubernetes Secret:
# Factor III's open-source litmus test asks whether the codebase could be made
# public right now without compromising any credentials. By isolating database
# passwords, Redis auth tokens, and RabbitMQ AMQP URIs into a dedicated Secret
# resource (`bookstore-secrets`), application source code and ConfigMaps remain
# 100% free of credentials.
#
# Local OrbStack vs. Production Secret Management:
# - In a local OrbStack Kubernetes cluster (`deploy/k8s/overlays/dev`), this
#   base Secret wires workloads to in-cluster containerized backing services
#   (postgres, redis, rabbitmq) so local development mirrors production topology.
# - In staging and production clusters, this Secret is provisioned out-of-band
#   by an External Secrets Operator, SealedSecrets, or CSI Secret Store driver
#   backed by AWS Secrets Manager, HashiCorp Vault, or GCP Secret Manager.
#
# When injected via `envFrom.secretRef`, .NET maps these double-underscore
# environment variables (`Bookstore__Postgres__ConnectionString`, etc.) onto
# `BookstoreConfigOptions` and validates them at startup via `ValidateOnStart()`.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-secrets
  namespace: twelve-factor-bookstore
  labels:
    app.kubernetes.io/part-of: twelve-factor-bookstore
    twelve-factor.io/factor: iii-config
type: Opaque
stringData:
  Bookstore__Postgres__ConnectionString: "Host=postgres.twelve-factor-bookstore.svc.cluster.local;Port=5432;Database=bookstore_catalog;Username=bookstore;Password=orbstack-local-dev-pwd"
  Bookstore__Redis__ConnectionString: "redis.twelve-factor-bookstore.svc.cluster.local:6379"
  Bookstore__RabbitMq__Uri: "amqp://guest:guest@rabbitmq.twelve-factor-bookstore.svc.cluster.local:5672/"
