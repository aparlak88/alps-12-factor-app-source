# ==============================================================================
# 12-Factor Principle: Factor IV — Backing Services
# Treat backing services as attached resources.
# ==============================================================================
#
# A backing service is any service the app consumes over the network as part of
# its normal operation. Examples include datastores (PostgreSQL), caching systems
# (Redis), and message/queueing systems (RabbitMQ).
#
# The code for a twelve-factor app makes no distinction between local and third
# party services. To the app, both are attached resources, accessed via a URL or
# other locator/credentials stored in the config (Factor III). A deploy of the
# twelve-factor app should be able to swap out a local PostgreSQL database
# running in Docker/OrbStack with one managed by a third party (such as Amazon
# RDS), or swap local Redis and RabbitMQ containers with Amazon ElastiCache and
# CloudAMQP, without any changes to the application's code.
#
# Similarly, a corrupted local container or hardware failure in production can
# be resolved by spinning up a replacement resource and attaching it via
# environment variables (Bookstore__Postgres__ConnectionString,
# Bookstore__Redis__ConnectionString, Bookstore__RabbitMq__Uri)—detaching the
# failed resource and attaching the new one with zero code deploys.
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: bookstore-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookstore_catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookstore_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: bookstore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: bookstore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
